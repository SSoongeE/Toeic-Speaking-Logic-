function answer(x){let supported='SpeechRecognition'in window||'webkitSpeechRecognition'in window;return`<div class="kick">STEP 3 · 영어 답변</div><h2>내 표현으로 완성해요</h2><div class="field"><label for="ans">영어 답변</label><textarea id="ans" placeholder="I prefer ... This is because ... As a result, ...">${esc(x.answer)}</textarea></div><div class="save" id="saveState">✓ 저장됨</div><div class="tools"><span class="count" id="cnt">${wc(x.answer)}단어 · 약 ${sec(x.answer)}초 · 권장 35~55단어</span><button class="btn secondary" id="dictate" ${supported?'':'disabled'}>${S.dictating?'■ 받아쓰기 중지':'🎙 말해서 입력'}</button><button class="btn secondary" id="timer">⏱ 30초</button><button class="btn secondary" id="record">● 녹음</button></div>${supported?'<p class="muted">영어로 말하면 인식된 문장이 답변란에 자동 입력되고 저장됩니다.</p>':'<p class="muted">이 브라우저는 음성 받아쓰기를 지원하지 않습니다. Chrome 또는 Edge 최신 버전을 이용해 주세요.</p>'}<div id="liveReview" aria-live="polite"></div><div id="aiReview" aria-live="polite"></div><div id="audio"></div>`}
const RULES=[['prefer watch','prefer watching','prefer 뒤에는 동명사를 사용합니다.'],['a home','at home','집에서는 at home을 사용합니다.'],['use time','use my time','소유격을 추가합니다.'],['more convenient to','more convenient than','비교 대상 앞에는 than을 사용합니다.'],['have time on visiting','have time to visit','to 뒤에는 동사원형을 사용합니다.'],['makes me save','helps me save','helps가 더 자연스럽습니다.'],['work with together','work together','together 앞에 with가 필요 없습니다.'],['spend money for','spend money on','spend + 돈 + on을 사용합니다.'],['have the high quality','are high-quality','형용사로 표현합니다.']];function check(q,t){let l=t.toLowerCase(),issues=RULES.filter(r=>l.includes(r[0])),minimal=t;issues.forEach(r=>minimal=minimal.replace(new RegExp(r[0],'ig'),r[1]));let choice=/i prefer|i think|most important|would rather/.test(l),reason=/because|allows|helps| i can| we can/.test(l),result=/as a result|therefore|that is why|so /.test(l),n=wc(t),status=!choice||!reason?'rewrite':issues.length||n<35||!result?'review':'good';return{issues,minimal,choice,reason,result,n,status,matched:q.keywords.filter(k=>l.includes(k))}}
function result(){let r=S.result,q=Q[S.qid-1],x=d(),label=r.status==='good'?'좋음':r.status==='review'?'수정 필요':'다시 작성 권장';shell(`<div class="section"><div><div class="kick">BASIC REVIEW</div><h1>답변 점검 결과 · ${label}</h1></div></div><div class="result"><section class="card"><h2>${r.status==='good'?'✓':'!'} ${label}</h2><p>${r.n}단어 · 약 ${sec(x.answer)}초 · 오류 ${r.issues.length}개</p><div class="checks"><div class="check">${r.choice?'✓':'○'} 선택이 명확한가요?</div><div class="check">${r.reason?'✓':'○'} 이유가 포함됐나요?</div><div class="check">${r.result?'✓':'○'} 결과가 연결됐나요?</div><div class="check">✓ 핵심 표현 ${r.matched.length}/${q.keywords.length}</div></div><p class="muted">등록된 표현과 기본 구조만 확인하는 제한적인 점검입니다.</p></section><section class="card"><div class="answer"><h3>내 답변</h3>${esc(x.answer)}</div><div class="answer" style="margin-top:10px"><h3>최소 수정 답변</h3>${esc(r.minimal)}${r.issues.map(i=>`<p class="muted">${i[0]} → <b>${i[1]}</b>: ${i[2]}</p>`).join('')}</div><details class="answer" style="margin-top:10px"><summary><b>추천 답변 펼치기</b></summary><p>${q.sample}</p></details><div class="tools"><button class="btn secondary" id="rewrite">다시 작성</button><button class="btn secondary" id="saveR">오답 노트 저장</button><button class="btn primary" id="nextQ">다음 문제</button></div></section></div>`);$('#rewrite').onclick=()=>{S.step=3;go('practice')};$('#saveR').onclick=()=>{let it=r.issues.length?r.issues:[['답변 구조 보완',q.sample,'추천 답변과 비교해 보세요.']];it.forEach(i=>S.reviews.unshift({qid:q.id,q:q.question,bad:i[0],good:i[1],why:i[2],date:new Date().toLocaleDateString()}));set('tosLogic_reviewItems',S.reviews);toast('복습 노트에 저장했어요.')};$('#nextQ').onclick=()=>{S.qid=q.id%10+1;S.step=1;S.hint=0;go('practice')}}
function review(){shell(`<div class="section"><div><div class="kick">REVIEW NOTE</div><h1>복습 노트</h1></div>${S.reviews.length?'<button class="btn danger" id="clear">전체 초기화</button>':''}</div><div class="list">${S.reviews.length?S.reviews.map((r,i)=>`<article class="card"><div class="kick">${r.date}</div><h3>${r.bad}</h3><p><b>${r.good}</b></p><p class="muted">${r.why}</p><button class="btn secondary" data-re="${r.qid}">다시 연습</button> <button class="btn danger" data-del="${i}">삭제</button></article>`).join(''):'<div class="card muted">저장한 오답 표현이 없습니다.</div>'}</div>`);document.querySelectorAll('[data-re]').forEach(b=>b.onclick=()=>go('practice',+b.dataset.re));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.reviews.splice(+b.dataset.del,1);set('tosLogic_reviewItems',S.reviews);review()});$('#clear')?.addEventListener('click',()=>{if(confirm('복습 노트를 모두 삭제할까요?')){S.reviews=[];set('tosLogic_reviewItems',[]);review()}})}
function logic(){shell(`<div class="section"><div><div class="kick">UNIVERSAL LOGIC</div><h1>만능 논리 카드</h1></div></div><div class="logic">${LOG.map((l,i)=>`<article class="card flash"><button data-l="${i}"><div class="kick">${l[0]}</div><h2>${l[0]}한다</h2><p class="muted">클릭하여 적용 상황 보기</p></button></article>`).join('')}</div>`);document.querySelectorAll('[data-l]').forEach(b=>{let n=0;b.onclick=()=>{let l=LOG[+b.dataset.l];n=(n+1)%3;b.innerHTML=n===1?`<div class="kick">적용 상황</div><h2>${l[2]}</h2><p class="muted">한 번 더 클릭하면 영어 표현</p>`:n===2?`<div class="kick">영어 표현</div><div class="en">${l[1]}</div><p>🔊 발음 듣기</p>`:`<div class="kick">${l[0]}</div><h2>${l[0]}한다</h2><p class="muted">클릭하여 적용 상황 보기</p>`;if(n===2)speak(l[1])}})}
function settings(){shell(`<div class="section"><h1>설정</h1></div><section class="card"><div class="field"><label>평균 발화 속도</label><select id="wpm">${[100,120,140].map(n=>`<option ${S.settings.wpm===n?'selected':''}>${n} WPM</option>`).join('')}</select></div><div class="field"><label>음성 속도</label><select id="rate">${[.8,1,1.2].map(n=>`<option value="${n}" ${S.settings.rate===n?'selected':''}>${n}×</option>`).join('')}</select></div><div class="field"><label>하루 목표</label><select id="daily">${[1,3,5].map(n=>`<option ${S.settings.daily===n?'selected':''}>${n}문제</option>`).join('')}</select></div><button class="btn danger" id="wipe">내 학습 데이터 삭제</button><p class="muted">모든 답변과 진도는 현재 브라우저에만 저장되며 외부로 전송되지 않습니다.</p></section>`);$('#wpm').onchange=e=>sv('wpm',parseInt(e.target.value));$('#rate').onchange=e=>sv('rate',+e.target.value);$('#daily').onchange=e=>sv('daily',parseInt(e.target.value));$('#wipe').onclick=()=>{if(confirm('모든 데이터를 삭제할까요?')){localStorage.clear();location.reload()}}}function sv(k,v){S.settings[k]=v;set('tosLogic_settings',S.settings);toast('저장했어요.')}
function normalizeQuestionCounts(){if(S.route==='home'){let n=document.querySelector('.stats .stat:nth-child(2) b');if(n)n.textContent=`${Object.values(S.progress).filter(x=>x.status==='done').length} / ${Q.length}`}if(S.route==='topics'){let k=document.querySelector('.section .kick');if(k)k.textContent=`${Q.length} QUESTIONS · 10 TOPICS`}if(S.route==='practice'){let q=Q[S.qid-1],label=document.querySelector('.phead b'),bar=document.querySelector('.phead .bar i');if(label)label.textContent=`${q.id}/${Q.length}`;if(bar)bar.style.width=`${q.id/Q.length*100}%`;if(S.step===3)renderLiveReview(d().answer)}if(S.route==='result'){let b=$('#nextQ');if(b)b.onclick=()=>{S.qid=S.qid%Q.length+1;S.step=1;S.hint=0;go('practice')}}}
function renderLiveReview(text){let box=$('#liveReview');if(!box)return;if(!text.trim()){box.innerHTML='<div class="live-review"><div class="live-title"><span>실시간 답변 코치</span><span class="muted">대기 중</span></div><div class="live-items muted">영어를 말하거나 입력하면 바로 점검합니다.</div></div>';return}let r=check(Q[S.qid-1],text),items=[];items.push(`${r.choice?'✓':'○'} 질문에 대한 선택 ${r.choice?'확인':'표현 필요 (I prefer / I think)'}`);items.push(`${r.reason?'✓':'○'} 구체적인 이유 ${r.reason?'확인':'연결어 필요 (because)'}`);items.push(`${r.result?'✓':'○'} 결과 연결 ${r.result?'확인':'결과 표현 필요 (As a result)'}`);if(r.n<20)items.push(`○ 현재 ${r.n}단어 · 이유나 결과를 더 추가해 보세요.`);else if(r.n<=55)items.push(`✓ 현재 ${r.n}단어 · 말하기에 적절한 분량입니다.`);else items.push(`△ 현재 ${r.n}단어 · 30초에 맞게 줄여 보세요.`);r.issues.forEach(i=>items.push(`△ “${i[0]}” → “${i[1]}”`));let good=r.choice&&r.reason&&r.result&&!r.issues.length&&r.n>=20&&r.n<=55;box.innerHTML=`<div class="live-review ${good?'good':'warn'}"><div class="live-title"><span>${good?'✓ 흐름이 좋아요':'실시간 답변 코치'}</span><span>${r.issues.length?`수정 ${r.issues.length}개`:'구조 점검'}</span></div><div class="live-items">${items.map(i=>`<div>${esc(i)}</div>`).join('')}</div>${r.issues.length?`<div class="live-fix"><b>최소 수정안</b><br>${esc(r.minimal)}<div class="tools"><button class="btn secondary" id="applyLiveFix">수정안 적용</button></div></div>`:''}</div>`;$('#applyLiveFix')?.addEventListener('click',()=>{let x=d(),area=$('#ans');x.answer=r.minimal;save(x);if(area)area.value=x.answer;updateAnswerStats(x.answer);toast('최소 수정안을 적용했어요.')})}
function updateAnswerStats(text){let c=$('#cnt');if(c)c.textContent=`${wc(text)}단어 · 약 ${sec(text)}초 · 권장 35~55단어`;renderLiveReview(text);scheduleAIReview(text)}
function scheduleAIReview(text){clearTimeout(S.aiTimer);if(wc(text)<7){renderAIState('영어 답변이 7단어 이상이면 AI가 자동으로 첨삭합니다.');return}if(location.protocol==='file:'){renderAIState('AI 첨삭은 API 키를 보호하기 위해 localhost 실행이 필요합니다. README의 실행 방법을 따라주세요.','warn');return}if(text.trim()===S.aiLast)return;S.aiTimer=setTimeout(()=>requestAIReview(text.trim()),1500)}
function renderAIState(message,type=''){let box=$('#aiReview');if(box)box.innerHTML=`<div class="live-review ${type}"><div class="live-title"><span>✦ OpenAI 실시간 첨삭</span><span>${type==='good'?'완료':type==='warn'?'확인 필요':'대기 중'}</span></div><div class="live-items">${esc(message)}</div></div>`}
async function requestAIReview(answer){S.aiController?.abort();S.aiController=new AbortController();renderAIState('답변의 문법, 논리와 자연스러움을 확인하고 있어요…');try{let q=Q[S.qid-1],response=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.question,answer,keywords:q.keywords}),signal:S.aiController.signal}),data=await response.json();if(!response.ok)throw new Error(data.error||'AI 첨삭 요청에 실패했습니다.');S.aiLast=answer;renderAIResult(data)}catch(error){if(error.name!=='AbortError')renderAIState(error.message,'warn')}}
function renderAIResult(data){let box=$('#aiReview');if(!box)return;let corrections=(data.corrections||[]).map(c=>`<div>△ “${esc(c.original)}” → “${esc(c.corrected)}”<br><span class="muted">${esc(c.reasonKo)}</span></div>`).join('');box.innerHTML=`<div class="live-review good"><div class="live-title"><span>✦ OpenAI 실시간 첨삭</span><span>완료</span></div><div class="live-items"><div><b>${esc(data.verdict)}</b></div><div>질문 관련성: ${esc(data.relevance)}</div><div>논리: ${esc(data.logic)}</div>${corrections||'<div>✓ 별도의 문법 수정이 필요하지 않습니다.</div>'}</div><div class="live-fix"><b>AI 최소 수정안</b><br>${esc(data.minimalRevision)}<div class="tools"><button class="btn secondary" id="applyAIFix">AI 수정안 적용</button><button class="btn secondary" id="showNatural">추천 답변 보기</button></div><div id="naturalAnswer"></div></div></div>`;$('#applyAIFix').onclick=()=>{let x=d(),area=$('#ans');x.answer=data.minimalRevision;save(x);if(area)area.value=x.answer;S.aiLast=x.answer;updateAnswerStats(x.answer);toast('AI 최소 수정안을 적용했어요.')};$('#showNatural').onclick=()=>{$('#naturalAnswer').innerHTML=`<p><b>더 자연스러운 추천 답변</b><br>${esc(data.naturalAnswer)}</p>`}}
function dictate(x){const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition)return toast('음성 받아쓰기를 지원하지 않는 브라우저입니다.');if(S.dictating){S.recognition?.stop();return}if(S.rec?.state==='recording')S.rec.stop();let recognition=new Recognition(),base=x.answer.trim();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;S.recognition=recognition;recognition.onstart=()=>{S.dictating=true;let b=$('#dictate');if(b){b.textContent='■ 받아쓰기 중지';b.classList.add('danger')}let s=$('#saveState');if(s)s.textContent='🎙 영어를 듣고 있어요…'};recognition.onresult=e=>{let finalText='',interim='';for(let i=e.resultIndex;i<e.results.length;i++){let text=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=text+' ';else interim+=text}if(finalText){base+=(base?' ':'')+finalText.trim();x.answer=base;save(x)}let area=$('#ans');if(area)area.value=base+(interim?' '+interim:'');updateAnswerStats(area?.value||base);let s=$('#saveState');if(s)s.textContent=interim?'🎙 인식 중…':'✓ 저장됨'};recognition.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('마이크 권한을 허용하면 음성 입력을 사용할 수 있어요.');else if(e.error!=='no-speech'&&e.error!=='aborted')toast('음성을 인식하지 못했어요. 다시 시도해 주세요.')};recognition.onend=()=>{S.dictating=false;let area=$('#ans');if(area&&area.value.trim()!==x.answer.trim()){x.answer=area.value.trim();save(x)}let b=$('#dictate');if(b){b.textContent='🎙 말해서 입력';b.classList.remove('danger')}let s=$('#saveState');if(s)s.textContent='✓ 저장됨'};try{recognition.start()}catch{toast('음성 인식을 다시 시작해 주세요.')}}
function bindLogicPicker(){document.querySelectorAll('[data-logic]').forEach(b=>b.onclick=()=>{S.logicPick=S.logicPick===+b.dataset.logic?null:+b.dataset.logic;render()})}
document.addEventListener('click',event=>{if(event.target?.id==='next'&&S.route==='practice'&&S.step===1&&!d().ko.some(Boolean)){event.preventDefault();event.stopImmediatePropagation();S.step=2;toast('머릿속으로 논리를 구상하고 넘어갑니다.');practice()}},true);
document.addEventListener('click',event=>{if(event.target?.id==='next'&&S.route==='practice'&&S.step===3&&!d().answer.trim()){event.preventDefault();event.stopImmediatePropagation();let q=Q[S.qid-1],x=d();S.result=check(q,'');x.status='review';x.date=new Date().toDateString();x.attempts++;x.history=[...(x.history||[]),''].slice(-3);save(x);toast('빈 답변 상태로 기본 점검을 진행합니다.');go('result')}},true);
document.addEventListener('click',event=>{if(event.target?.id==='nextQ'){S.logicPick=null}},true);
function ensureDraftControls(){if(S.route!=='practice'||![1,3].includes(S.step))return;let saveLabel=document.querySelector('.save');if(!saveLabel||document.querySelector('#clearDraft'))return;let button=document.createElement('button');button.type='button';button.id='clearDraft';button.className='btn danger';button.style.marginTop='8px';button.textContent=S.step===1?'한국어 논리 초기화':'영어 답변 초기화';button.onclick=()=>{let x=d(),kind=S.step===1?'한국어 논리와 선택':'영어 답변';if(!confirm(`${kind}에 저장된 내용을 지울까요?`))return;if(S.step===1){x.ko=['','','',''];x.choice='';S.logicPick=null}else{x.answer='';S.aiLast=''}save(x);toast(`${kind}을 초기화했습니다.`);practice()};saveLabel.insertAdjacentElement('afterend',button)}
const draftObserver=new MutationObserver(()=>queueMicrotask(()=>{ensureDraftControls();bindLogicPicker()}));draftObserver.observe($('#app'),{childList:true,subtree:true});
function speak(t){if(!speechSynthesis)return toast('음성 재생을 지원하지 않는 브라우저입니다.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=S.settings.rate;speechSynthesis.speak(u)}function timer(){clearInterval(S.timer);let n=30,b=$('#timer');S.timer=setInterval(()=>{n--;b.textContent=`⏱ ${n}초`;if(n<=0){clearInterval(S.timer);toast('30초가 끝났어요.')}},1000)}async function record(){if(!navigator.mediaDevices||!window.MediaRecorder)return toast('녹음을 지원하지 않는 브라우저입니다.');if(S.rec?.state==='recording')return S.rec.stop();if(S.dictating)S.recognition?.stop();try{let stream=await navigator.mediaDevices.getUserMedia({audio:true}),chunks=[];S.rec=new MediaRecorder(stream);S.rec.ondataavailable=e=>chunks.push(e.data);S.rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());let url=URL.createObjectURL(new Blob(chunks,{type:'audio/webm'}));$('#audio').innerHTML=`<audio controls src="${url}"></audio>`;$('#record').textContent='● 녹음'};S.rec.start();$('#record').textContent='■ 중지';timer()}catch{toast('마이크 권한 없이 텍스트 연습을 계속합니다.')}}function render(){({home,topics,practice,result,review,logic,settings}[S.route]||home)();normalizeQuestionCounts();bindLogicPicker()}render();
</script></body></html>
